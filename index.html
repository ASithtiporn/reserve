<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองห้องเรียน</title>
    <!-- เชื่อมโยงกับไฟล์ CSS -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- ฝั่งซ้าย: ปฏิทิน (Google Calendar) -->
        <div class="calendar-section">
            <h2>🗓️ เช็คสถานะห้องว่าง</h2>
            <p>กรุณาตรวจสอบวันและเวลาที่ว่างก่อนทำการจอง</p>
            <div class="iframe-container">
                <!-- นำลิงก์ src ของ Google Calendar ของคุณมาใส่ตรงนี้ -->
                <iframe src="https://calendar.google.com/calendar/embed?src=4fae5d7f661ea9491ac7261e567f9ab8188eb48f82179966313b8f4bc53e783e%40group.calendar.google.com&ctz=Asia%2FBangkok" style="border: 0" frameborder="0" scrolling="no"></iframe>
            </div>
        </div>

        <!-- ฝั่งขวา: ฟอร์มจองห้อง -->
        <div class="form-section">
            <h2>📝 แบบฟอร์มจองห้อง</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>ชื่อ-นามสกุล / หน่วยงาน</label>
                    <input type="text" name="name" required placeholder="กรอกชื่อของคุณ">
                </div>

                <div class="form-group">
                    <label>เลือกห้องที่ต้องการ</label>
                    <select name="room" required>
                        <option value="" disabled selected>-- กรุณาเลือกห้อง --</option>
                        <option value="ห้อง 101">ห้อง 101</option>
                        <option value="ห้อง 102">ห้อง 102</option>
                        <option value="ห้องประชุมใหญ่">ห้องประชุมใหญ่</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>วันที่ต้องการใช้งาน</label>
                    <input type="date" name="date" required>
                </div>

                <div class="form-group">
                    <label>เวลาที่ใช้งาน</label>
                    <input type="text" name="time" required placeholder="เช่น 09.00 - 12.00 น.">
                </div>

                <button type="submit" id="submitBtn">
                    <span id="btnText">ยืนยันการจอง</span>
                    <div id="loading" class="loader"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- โค้ด JavaScript สำหรับส่งข้อมูลไป Google Sheets (Excel) -->
    <script>
        // ⚠️ นำ URL ของ Web App (Google Apps Script) มาใส่ที่นี่
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw2AQDIi0RDncAdc4ccF_6ZZFv76jK9O-x-unwiuXRhnPoOAidONv8r9Rh3v6H1nNHUTg/exec'; 
        
        const form = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            // เปลี่ยนสถานะปุ่มตอนโหลด
            submitBtn.disabled = true;
            submitBtn.classList.add('disabled');
            btnText.style.display = 'none';
            loading.style.display = 'block';

            // ส่งข้อมูลไปยัง Google Sheets
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert('🎉 บันทึกการจองสำเร็จแล้ว!');
                    form.reset(); 
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('เกิดข้อผิดพลาด โปรดลองอีกครั้ง');
                })
                .finally(() => {
                    // คืนค่าปุ่มกลับมาเหมือนเดิม
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('disabled');
                    btnText.style.display = 'block';
                    loading.style.display = 'none';
                });
        });
    </script>
</body>
</html>
